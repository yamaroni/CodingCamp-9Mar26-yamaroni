<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StorageService Manual Tests</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .test-result {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .pass {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .fail {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    h1 { color: #333; }
    h2 { color: #666; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>StorageService Manual Tests</h1>
  <div id="results"></div>

  <script src="../js/app.js"></script>
  <script>
    const results = document.getElementById('results');
    let passCount = 0;
    let failCount = 0;

    function logTest(name, passed, message = '') {
      const div = document.createElement('div');
      div.className = `test-result ${passed ? 'pass' : 'fail'}`;
      div.textContent = `${passed ? '✓' : '✗'} ${name}${message ? ': ' + message : ''}`;
      results.appendChild(div);
      
      if (passed) passCount++;
      else failCount++;
    }

    function runTests() {
      // Clear localStorage before tests
      localStorage.clear();
      
      const storage = new StorageService();

      // Test 1: isAvailable
      logTest('isAvailable returns true', storage.isAvailable() === true);

      // Test 2: get returns null for non-existent key
      logTest('get returns null for non-existent key', storage.get('non-existent') === null);

      // Test 3: set and get with object
      const testData = { name: 'Test', value: 42 };
      storage.set('test-key', testData);
      const retrieved = storage.get('test-key');
      logTest('set and get with object', 
        retrieved !== null && 
        retrieved.name === testData.name && 
        retrieved.value === testData.value
      );

      // Test 4: set and get with array
      const testArray = [1, 2, 3, 4, 5];
      storage.set('array-key', testArray);
      const retrievedArray = storage.get('array-key');
      logTest('set and get with array', 
        Array.isArray(retrievedArray) && 
        retrievedArray.length === 5 &&
        retrievedArray[0] === 1
      );

      // Test 5: corrupted data handling
      localStorage.setItem('corrupted', 'invalid-json{');
      const corruptedResult = storage.get('corrupted');
      logTest('handles corrupted JSON gracefully', corruptedResult === null);

      // Test 6: remove
      storage.set('to-remove', { value: 123 });
      storage.remove('to-remove');
      logTest('remove deletes data', storage.get('to-remove') === null);

      // Test 7: clear
      storage.set('key1', 'value1');
      storage.set('key2', 'value2');
      storage.clear();
      logTest('clear removes all data', 
        storage.get('key1') === null && 
        storage.get('key2') === null
      );

      // Test 8: round trip with complex data
      const complexData = {
        id: '123',
        text: 'Test task',
        completed: false,
        createdAt: Date.now(),
        nested: { value: 42 }
      };
      storage.set('complex', complexData);
      const retrievedComplex = storage.get('complex');
      logTest('round trip with complex data', 
        retrievedComplex !== null &&
        retrievedComplex.id === complexData.id &&
        retrievedComplex.nested.value === 42
      );

      // Test 9: JSON serialization preserves types
      const typedData = {
        string: 'hello',
        number: 42,
        boolean: true,
        null: null,
        array: [1, 2, 3]
      };
      storage.set('types', typedData);
      const retrievedTypes = storage.get('types');
      logTest('JSON serialization preserves types',
        retrievedTypes.string === 'hello' &&
        retrievedTypes.number === 42 &&
        retrievedTypes.boolean === true &&
        retrievedTypes.null === null &&
        Array.isArray(retrievedTypes.array)
      );

      // Summary
      const summary = document.createElement('h2');
      summary.textContent = `Results: ${passCount} passed, ${failCount} failed`;
      summary.style.color = failCount === 0 ? '#155724' : '#721c24';
      results.appendChild(summary);

      console.log(`Tests completed: ${passCount} passed, ${failCount} failed`);
    }

    // Run tests when page loads
    runTests();
  </script>
</body>
</html>
