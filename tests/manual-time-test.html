<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeManager Manual Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .display {
            font-size: 24px;
            margin: 10px 0;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>TimeManager Manual Test</h1>
    
    <div class="test-section">
        <h2>Live Time Display</h2>
        <div id="greeting" class="display">Greeting will appear here</div>
        <div id="time" class="display">Time will appear here</div>
        <div id="date" class="display">Date will appear here</div>
        <button id="start-btn">Start</button>
        <button id="stop-btn">Stop</button>
    </div>

    <div class="test-section">
        <h2>Format Tests</h2>
        <div id="format-tests"></div>
    </div>

    <script type="module">
        // Import TimeManager from app.js
        import { TimeManager } from '../js/app.js';

        // Set up live display
        const greetingEl = document.getElementById('greeting');
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');
        const timeManager = new TimeManager(timeEl, dateEl, greetingEl);

        document.getElementById('start-btn').addEventListener('click', () => {
            timeManager.start();
        });

        document.getElementById('stop-btn').addEventListener('click', () => {
            timeManager.stop();
        });

        // Run format tests
        const formatTestsEl = document.getElementById('format-tests');
        const testManager = new TimeManager(null, null, null);

        const tests = [
            { date: new Date('2024-01-01T00:00:00'), desc: 'Midnight' },
            { date: new Date('2024-01-01T12:00:00'), desc: 'Noon' },
            { date: new Date('2024-01-01T09:30:45'), desc: 'Morning' },
            { date: new Date('2024-01-01T15:30:45'), desc: 'Afternoon' },
            { date: new Date('2024-12-25T23:59:59'), desc: 'Late night' },
        ];

        let html = '<table border="1" cellpadding="5"><tr><th>Description</th><th>Time</th><th>Date</th></tr>';
        tests.forEach(test => {
            html += `<tr>
                <td>${test.desc}</td>
                <td>${testManager.formatTime(test.date)}</td>
                <td>${testManager.formatDate(test.date)}</td>
            </tr>`;
        });
        html += '</table>';
        formatTestsEl.innerHTML = html;

        // Start automatically
        timeManager.start();
    </script>
</body>
</html>
